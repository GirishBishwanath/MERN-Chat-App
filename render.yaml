services:
  - type: web
    name: mern-chat-backend
    env: node
    plan: starter
    region: oregon
    branch: main
    buildCommand: cd Backend && npm install
    startCommand: cd Backend && npm start
    autoDeploy: true
    envVars:
      - key: POSTGRES_HOST
      - key: POSTGRES_PORT
      - key: POSTGRES_DATABASE
      - key: POSTGRES_USER
      - key: POSTGRES_PASSWORD
      - key: POSTGRES_SSL
      - key: REDIS_URL
      - key: JWT_SECRET
      - key: CORS_ORIGINS
